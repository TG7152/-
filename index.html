<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>清音交易所 · 管理后台</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#131b2e;--line:#26334d;--muted:#9aa8c2;--text:#edf2ff;--accent:#5b8cff;--good:#39c98a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
header{height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#0e1628;position:sticky;top:0}
.brand{font-weight:750;font-size:17px}.brand span{color:var(--accent)}main{max-width:1200px;margin:28px auto;padding:0 20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}
.login{max-width:420px;margin:70px auto}.muted{color:var(--muted)}input,select,button{font:inherit;border-radius:8px;padding:11px 12px;border:1px solid var(--line);background:#0d1526;color:var(--text);width:100%;margin:6px 0}
button{background:var(--accent);border:0;font-weight:650;cursor:pointer}button.secondary{background:#263653}button:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.metric{font-size:26px;font-weight:750;margin-top:8px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}nav button{width:auto;margin:0;padding:9px 14px}nav button.active{background:#315fcb}
table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:11px 9px;white-space:nowrap}th{color:var(--muted);font-weight:600}
.tablewrap{overflow:auto}.hidden{display:none}.status{color:var(--good)}.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:160px}
.notice{padding:12px;border:1px solid #66552b;background:#2a2416;color:#f4d58b;border-radius:9px;margin:12px 0}
#msg{margin:10px 0;color:#f4d58b;white-space:pre-wrap}
@media(max-width:600px){header{padding:0 14px}main{padding:0 12px;margin:16px auto}.card{padding:15px}}
</style>
</head>
<body>
<header><div class="brand">清音交易所 <span>ADMIN</span></div><div><span id="who" class="muted"></span> <button id="logout" class="secondary hidden" style="width:auto;margin-left:8px">退出</button></div></header>
<main>
<section id="login" class="card login">
<h2>管理员登录</h2><p class="muted">使用已授权的 Supabase 管理员账户登录。</p>
<form id="loginForm"><input id="email" type="email" placeholder="管理员邮箱" value="mvqing0820@gmail.com" required><input id="password" type="password" placeholder="密码" required><button>登录管理后台</button></form><div id="msg"></div>
</section>
<section id="app" class="hidden">
<div class="notice">当前为管理后台基础版。币种和交易对创建后默认停用；真实充值、提现和撮合尚未开放。</div>
<nav id="tabs">
<button data-tab="dashboard" class="active">总览</button><button data-tab="assets">币种</button><button data-tab="markets">交易对</button><button data-tab="users">用户</button><button data-tab="orders">订单</button><button data-tab="trades">成交</button><button data-tab="kyc">KYC</button><button data-tab="deposits">充值</button><button data-tab="withdrawals">提现</button><button data-tab="risk">风控</button><button data-tab="audit">审计日志</button>
</nav>
<div id="msg"></div>
<section id="dashboard" class="tab">
<div class="grid" id="metrics"></div>
</section>
<section id="assets" class="tab hidden">
<div class="card"><h3>新增币种</h3><form id="assetForm" class="row"><input name="symbol" placeholder="币种代码，如 LTC" required><input name="name" placeholder="币种名称" required><select name="asset_type"><option value="crypto">数字资产</option><option value="fiat">法币</option></select><input name="decimals" type="number" min="0" max="18" value="8" required><button>新增（默认停用）</button></form></div>
<div class="card"><h3>币种列表</h3><div class="tablewrap" id="assetsTable"></div></div>
</section>
<section id="markets" class="tab hidden">
<div class="card"><h3>新增交易对</h3><form id="marketForm" class="row"><input name="symbol" placeholder="如 LTC/USDT" required><input name="base_asset_symbol" placeholder="基础币，如 LTC" required><input name="quote_asset_symbol" placeholder="计价币，如 USDT" required><input name="price_precision" type="number" min="0" max="18" value="8"><input name="quantity_precision" type="number" min="0" max="18" value="8"><input name="min_quantity" type="number" min="0" step="any" value="0"><button>新增交易对（默认停用）</button></form></div>
<div class="card"><h3>交易对列表</h3><div class="tablewrap" id="marketsTable"></div></div>
</section>
<div id="generic" class="card hidden"><h3 id="genericTitle"></h3><div class="tablewrap" id="genericTable"></div></div>
</section>
</main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const URL='https://plukopgifmrlyjwqryqu.supabase.co';
const KEY='sb_publishable_TzqgIPjG81soEW52841JKQ_opgokLOH';
const sb=createClient(URL,KEY);
let session=null;
const $=id=>document.getElementById(id);
const msg=t=>{$('msg').textContent=t||''};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,method='GET',body){
 const {data:{session:s}}=await sb.auth.getSession(); if(!s) throw Error('登录已过期，请重新登录');
 const r=await fetch(`${URL}/functions/v1/exchange-admin/${path}`,{method,headers:{apikey:KEY,Authorization:`Bearer ${s.access_token}`,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
 const j=await r.json();if(!r.ok)throw Error(j.error||`请求失败 ${r.status}`);return j;
}
function table(el,rows){
 if(!rows?.length){$(el).innerHTML='<p class="muted">暂无记录</p>';return}
 const cols=Object.keys(rows[0]);$(''+el).innerHTML=`<table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${cols.map(c=>`<td>${esc(typeof row[c]==='object'?JSON.stringify(row[c]):row[c])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
async function load(tab){
 msg('加载中…');
 try{
  if(tab==='dashboard'){
   const j=await api('dashboard');const labels={users:'用户数',assets:'币种数',markets:'交易对',orders:'订单数',trades:'成交数',pendingKyc:'待审核 KYC',pendingWithdrawals:'待处理提现',openRiskFlags:'未关闭风控'};
   $('metrics').innerHTML=Object.entries(j.metrics).map(([k,v])=>`<div class="card"><div class="muted">${labels[k]||k}</div><div class="metric">${v}</div></div>`).join('');
  }else if(tab==='assets'||tab==='markets'){
   const j=await api(tab);table(tab+'Table',j.data);
  }else{
   const titles={users:'用户列表',orders:'订单列表',trades:'成交记录',kyc:'KYC 审核记录',deposits:'充值记录',withdrawals:'提现记录',risk:'风控事件',audit:'审计日志'};
   $('genericTitle').textContent=titles[tab]||tab;const j=await api(tab);table('genericTable',j.data);
  }
  msg('');
 }catch(e){msg(e.message)}
}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();msg('登录中…');const {data,error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){msg(error.message);return}session=data.session;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');$('who').textContent=data.user.email;await load('dashboard')});
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
$('tabs').addEventListener('click',async e=>{const b=e.target.closest('button[data-tab]');if(!b)return;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));$('generic').classList.add('hidden');const t=b.dataset.tab;if(['dashboard','assets','markets'].includes(t))$(t).classList.remove('hidden');else $('generic').classList.remove('hidden');await load(t)});
$('assetForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api('assets','POST',{symbol:f.get('symbol'),name:f.get('name'),asset_type:f.get('asset_type'),decimals:Number(f.get('decimals'))});e.target.reset();msg('币种已创建，默认停用。');await load('assets')}catch(x){msg(x.message)}};
$('marketForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api('markets','POST',{symbol:f.get('symbol'),base_asset_symbol:f.get('base_asset_symbol'),quote_asset_symbol:f.get('quote_asset_symbol'),price_precision:Number(f.get('price_precision')),quantity_precision:Number(f.get('quantity_precision')),min_quantity:Number(f.get('min_quantity'))});msg('交易对已创建，默认停用。');await load('markets')}catch(x){msg(x.message)}};
</script>
</body></html>
